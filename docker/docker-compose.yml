# Per-machine worker stack (issue #12): ComfyUI + F5-TTS sharing the host GPU(s).
#
# On each worker machine:
#   cp .env.example .env        # then set MODELS_DIR (and CUDA/torch if needed)
#   docker compose up -d --build
#
# Then point the controller's config.yaml at this machine:
#   comfy_workers: [ http://<host>:8188 ]
#   tts_workers:   [ http://<host>:8189 ]   # http:// URL = containerized TTS
name: spielbot-worker

services:
  comfyui:
    build:
      context: ..
      dockerfile: docker/comfyui/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:13.0.1-runtime-ubuntu24.04}
        # v0.30.0 = first ComfyUI release with native MiniMax H3 nodes.
        COMFYUI_REF: ${COMFYUI_REF:-v0.30.0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    image: spielbot-comfyui:latest
    # fp16 accumulation speeds up bf16 GEMMs on Blackwell (GB10) with no
    # observed quality cost; part of the H3 speed pass. Overrides the image CMD.
    command: ["python3", "main.py", "--listen", "0.0.0.0", "--port", "8188",
              "--fast", "fp16_accumulation"]
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    environment:
      # Route GEMMs through cuBLASLt. On DGX Spark / GB10 the legacy cuBLAS path
      # fails specific bf16 GEMMs (CUBLAS_STATUS_INTERNAL_ERROR), breaking every
      # FLUX.2 model; cuBLASLt avoids it. Set to 1 in .env on GB10 (no rebuild).
      - TORCH_BLAS_PREFER_CUBLASLT=${TORCH_BLAS_PREFER_CUBLASLT:-}
    volumes:
      # ~49 GB of models live on the host; populate once (see docker/README.md).
      - ${MODELS_DIR:?set MODELS_DIR in docker/.env}:/opt/ComfyUI/models
      # Large finished-film upscales are staged here instead of HTTP-uploaded
      # to ComfyUI, avoiding request-size limits on /upload/image.
      - ${COMFYUI_INPUT_DIR:-./input}:/opt/ComfyUI/input
      - comfyui-output:/opt/ComfyUI/output
    # Let autoheal restart this container if its GPU-aware healthcheck fails
    # (silent CPU fallback after a host daemon-reload — see the autoheal service).
    labels:
      autoheal: "true"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tts:
    build:
      context: ..
      dockerfile: docker/tts/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:13.0.1-runtime-ubuntu24.04}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    image: spielbot-tts:latest
    ports:
      - "${TTS_PORT:-8189}:8189"
    volumes:
      # Persist the OpenF5-TTS-Base weights (~5.4 GB) across container recreation.
      - hf-cache:/cache/huggingface
    # Let autoheal restart this container if its GPU-aware healthcheck fails
    # (silent CPU fallback after a host daemon-reload — see the autoheal service).
    labels:
      autoheal: "true"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  echomimic:
    build:
      context: ..
      dockerfile: docker/echomimic/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:13.0.1-runtime-ubuntu24.04}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    image: spielbot-echomimic:latest
    ports:
      - "${ECHOMIMIC_PORT:-8190}:8190"
    environment:
      # GB10 GEMM routing (see the comfyui service) — harmless elsewhere.
      - TORCH_BLAS_PREFER_CUBLASLT=${TORCH_BLAS_PREFER_CUBLASLT:-}
    volumes:
      # ~27 GB of EchoMimic + Wan2.1-Fun-1.3B + wav2vec weights, fetched on first
      # use and persisted across container recreation.
      - echomimic-weights:/weights
      - hf-cache:/cache/huggingface
    labels:
      autoheal: "true"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Self-heal GPU loss ──────────────────────────────────────────────────────
  # A host `systemctl daemon-reload` / driver update can revoke the GPU from an
  # already-running container ("Failed to initialize NVML: Unknown Error"), after
  # which F5-TTS / ComfyUI silently fall back to CPU. The GPU-aware HEALTHCHECKs
  # (in each Dockerfile) mark such a container "unhealthy"; autoheal then restarts
  # it, which re-runs the NVIDIA prestart hook and reclaims the GPU — the same fix
  # as `docker restart`, applied automatically. It watches only containers
  # labelled autoheal=true. To disable, delete this service (the labels go inert).
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30        # seconds between unhealthy-container sweeps
      AUTOHEAL_START_PERIOD: 120   # grace before acting on a (re)started container
      CURL_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  comfyui-output:
  hf-cache:
  echomimic-weights:
