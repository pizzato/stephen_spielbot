# Ruff configuration — Python linting for Stephen Spielbot.
#
# Scoped to high-signal correctness checks rather than style: pyflakes (F)
# catches dead code and bugs — unused imports (F401), unused locals (F841),
# undefined names (F821), f-string mistakes — and E9 catches syntax errors.
#
# Style rules (E4/E7) are intentionally omitted: this codebase deliberately
# imports after sys.path setup (E402), so enforcing them would be noise.
target-version = "py310"

exclude = [
    ".venv",
    "node_modules",
    "webapp/frontend",
]

[lint]
select = ["F", "E9"]

[lint.per-file-ignores]
# Not a module: this file is CAT-APPENDED onto the end of the H3 Motion
# Context pack's nodes.py (see docker/comfyui/Dockerfile), so it runs with
# that file's imports, constants and node registries already in scope —
# _LOG, node_helpers, AUDIO_HZ, NODE_CLASS_MAPPINGS and friends are defined
# above it, not missing. Read standalone every one of them looks undefined,
# which is exactly what F821 reports. Syntax errors (E9) still apply.
"docker/comfyui/h3_audio_track/*.py" = ["F821"]
