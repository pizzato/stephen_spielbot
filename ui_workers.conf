# UI worker endpoints — one ComfyUI URL per line.
#
# A "ui" worker handles lightweight interface tasks (e.g. regenerating a
# YouTube cover image) so they don't wait behind the heavy render workers in
# cluster.conf. Each line is the ComfyUI URL the ui worker renders against —
# point it at a cheap/spare ComfyUI (or your local one) that has FLUX models.
#
# The ui worker PROCESS runs on this machine (next to the web app, sharing its
# orchestrator DB); only the ComfyUI endpoint below can be remote.
#
# Empty file (all lines commented) = no ui worker, and cover regeneration will
# queue forever. Keep at least one endpoint here.

http://localhost:8188
