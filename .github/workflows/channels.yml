name: Sync channels list

# channels.yaml is the source of truth for "Channels using this tool". This
# workflow keeps its two rendered copies — the README list and the About
# screen's bundled channels.json — in step with it.
#
# On a pull request it only validates, so a malformed entry fails the check
# before merge (and fork PRs need no write access). On merge to main it
# regenerates and opens a follow-up pull request with the result, so
# contributors only ever edit one file. It cannot push to main directly —
# branch protection rejects that (GH006) — hence the follow-up PR.
on:
  push:
    branches: [main]
    paths:
      - channels.yaml
      - scripts/gen_channels.py
      - .github/workflows/channels.yml
  pull_request:
    paths:
      - channels.yaml
      - scripts/gen_channels.py
      - .github/workflows/channels.yml

permissions:
  contents: read

jobs:
  sync:
    name: Render channels.yaml
    runs-on: ubuntu-latest
    # Needed by the post-merge pull request step below. `permissions` takes no
    # expressions, so it is granted for both events; only the push run writes,
    # and GitHub downgrades the token to read-only for pull requests from forks.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      # Fails the build on a malformed entry, naming the offending one.
      - name: Render
        run: python scripts/gen_channels.py

      # The generator is deterministic, so a diff here means channels.yaml
      # changed and the rendered copies need to catch up. main is protected, so
      # the result goes onto a fixed branch and into a pull request for a human
      # to merge; re-running force-updates that branch and reuses the open PR.
      - name: Open sync pull request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/sync-channels
        run: |
          if [ -z "$(git status --porcelain README.md webapp/frontend/src/channels.json)" ]; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add README.md webapp/frontend/src/channels.json
          git commit -m "chore: sync channels list from channels.yaml"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing pull request updated."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore: sync channels list from channels.yaml" \
            --body "Regenerated \`README.md\` and \`webapp/frontend/src/channels.json\` from \`channels.yaml\` after ${{ github.sha }}."
